<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
      body {
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        min-height: 100vh;
        color: #fff;
      }
      .game-title {
        font-size: 3.5rem;
        font-weight: bold;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        margin-bottom: 2rem;
      }
      .choice-btn {
        transition: all 0.3s ease;
        border: none;
        padding: 1.5rem;
        font-size: 2rem;
        border-radius: 15px;
        background: rgba(255,255,255,0.1);
        backdrop-filter: blur(10px);
        color: white;
      }
      .choice-btn:hover {
        transform: translateY(-5px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      }
      .result-card {
        background: rgba(255,255,255,0.1);
        backdrop-filter: blur(10px);
        border-radius: 15px;
        padding: 2rem;
        margin-top: 2rem;
      }
      .score-board {
        font-size: 1.5rem;
        margin-bottom: 1rem;
      }
      .choice-icon {
        font-size: 3rem;
        margin-bottom: 1rem;
      }
      .vs-animation {
        animation: pulse 1s infinite;
      }
      @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.1); }
        100% { transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <div class="container py-5">
      <h1 class="game-title text-center">Rock Paper Scissors</h1>
      
      <div class="row justify-content-center mb-4">
        <div class="col-md-8">
          <div class="score-board text-center">
            <span id="user-score">0</span> - <span id="computer-score">0</span>
          </div>
        </div>
      </div>

      <div class="row justify-content-center gap-4 mb-5">
        <div class="col-md-3">
          <button id="rock" class="choice-btn w-100">
            <div class="choice-icon">✊</div>
            Rock
          </button>
        </div>
        <div class="col-md-3">
          <button id="paper" class="choice-btn w-100">
            <div class="choice-icon">✋</div>
            Paper
          </button>
        </div>
        <div class="col-md-3">
          <button id="scissors" class="choice-btn w-100">
            <div class="choice-icon">✌️</div>
            Scissors
          </button>
        </div>
      </div>

      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="result-card text-center">
            <h2 id="result" class="mb-4">Choose your move!</h2>
            <div id="message" class="fs-4"></div>
            <div class="mt-4">
              <div id="user-choice" class="d-inline-block mx-3"></div>
              <span class="vs-animation mx-3">VS</span>
              <div id="computer-choice" class="d-inline-block mx-3"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="index.js"></script>
  </body>
</html>
